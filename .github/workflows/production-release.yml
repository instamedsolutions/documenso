name: Deploy Production

env:
  ENVIRONMENT: 'production'
  IMAGE_NAME: ${{ github.repository }}
  DOCKER_TAG: 'latest'

on:
  push:
    tags:
      - 'v*'
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: production-release-${{ github.ref }}-1
  cancel-in-progress: true

jobs:
  docker-build-production:
    name: Build Latest Image
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    environment:
      name: 'production'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build production image
        uses: ./.github/actions/build-docker-image
        with:
          registry_username: ${{ github.actor }}
          registry_password: ${{ secrets.GITHUB_TOKEN }}
          docker_image: ${{ env.IMAGE_NAME }}
          docker_tag: ${{ env.DOCKER_TAG }}
          next_private_telemetry_key: ${{ secrets.NEXT_PRIVATE_TELEMETRY_KEY }}
          next_private_telemetry_host: ${{ secrets.NEXT_PRIVATE_TELEMETRY_HOST }}

  docker-build-tag:
    name: Build tag image
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: 'production'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build tagged image
        uses: ./.github/actions/build-docker-image
        with:
          registry_username: ${{ github.actor }}
          registry_password: ${{ secrets.GITHUB_TOKEN }}
          docker_image: ${{ env.IMAGE_NAME }}
          docker_tag: ${{ github.ref_name }}
          next_private_telemetry_key: ${{ secrets.NEXT_PRIVATE_TELEMETRY_KEY }}
          next_private_telemetry_host: ${{ secrets.NEXT_PRIVATE_TELEMETRY_HOST }}

  # Mirror the image just pushed to ghcr into Amazon ECR, so ECS pulls it over
  # the VPC's ECR interface endpoints instead of ghcr.io over the NAT Gateway.
  # Retag (pull + tag + push) rather than rebuild - the Next.js build already
  # ran in the docker-build-* job. One job per build variant so it mirrors the
  # same tag that was built (latest for a branch push, vX.Y.Z for a tag).
  ecr-deploy-latest:
    name: Mirror Latest Image to ECR
    needs: docker-build-production
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      packages: read
    environment:
      name: 'production'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Retag ghcr image to ECR
        uses: ./.github/actions/retag-to-ecr
        with:
          registry_username: ${{ github.actor }}
          registry_password: ${{ secrets.GITHUB_TOKEN }}
          docker_image: ${{ env.IMAGE_NAME }}
          docker_tag: ${{ env.DOCKER_TAG }}
          aws_role_arn: ${{ secrets.AWS_ROLE_ARN }}
          aws_account_id: ${{ secrets.AWS_ACCOUNT_ID }}

  ecr-deploy-tag:
    name: Mirror Tagged Image to ECR
    needs: docker-build-tag
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      packages: read
    environment:
      name: 'production'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Retag ghcr image to ECR
        uses: ./.github/actions/retag-to-ecr
        with:
          registry_username: ${{ github.actor }}
          registry_password: ${{ secrets.GITHUB_TOKEN }}
          docker_image: ${{ env.IMAGE_NAME }}
          docker_tag: ${{ github.ref_name }}
          aws_role_arn: ${{ secrets.AWS_ROLE_ARN }}
          aws_account_id: ${{ secrets.AWS_ACCOUNT_ID }}
