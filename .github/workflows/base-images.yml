name: Base images

# Refuse une image de base externe qui n'est pas figée en image:tag@sha256 (scripts/check-base-images.py).
# Les bumps de digest et de version sont proposés par Renovate, exécuté depuis le dépôt infra.
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  base-images:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Check base images
        run: python3 -I scripts/check-base-images.py --exclude apps --exclude docker/development
